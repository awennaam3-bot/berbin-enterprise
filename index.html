.p b{display:block}.p small,.mu{color:var(--mu)}.price{color:var(--ac);font-weight:700}
.qty{display:flex;align-items:center;justify-content:space-between;margin-top:8px}.qty button,.btn{border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;padding:8px 12px}.qty button{width:36px;padding:6px}.btn.w{width:100%;padding:13px;font-weight:700;margin-top:8px;background:var(--wa)}
.bar{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:auto;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd)}.bar .btn{width:100%;background:var(--wa);font-weight:700;padding:13px}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}input,select,textarea{width:100%;padding:10px;margin:4px 0;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
h3{margin:14px 0 6px}.back{background:none;border:0;color:var(--ac);font:inherit;padding:6px 0}
</style></head><body>

function render(){
  $('#m').innerHTML=view==='shop'?shop():checkout();
  $('#b').innerHTML=view==='shop'?(count()?`<button class="btn" id="rv">Review order (${count()}) · ${money(total())}</button>`:`<button class="btn" id="ask">💬 Ask us on WhatsApp</button>`):'';
  bind();
}
function shop(){
  const cats=['All',...new Set(P.map(p=>p.cat))];
  const list=P.filter(p=>(cat==='All'||p.cat===cat)&&p.stock!==false);
  return `<div class="chips">${cats.map(c=>`<button class="chip ${c===cat?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
  <div class="grid">${list.map(p=>`<div class="card p">${p.img?`<img class="ph" loading="lazy" alt="${esc(p.name)}" src="${p.img}">`:`<div class="ph em">${esc(p.emoji||'📦')}</div>`}
  <b>${esc(p.name)}</b>${p.unit?`<small>${esc(p.unit)}</small>`:''}<div class="price">${money(p.price)}</div>
  <div class="qty"><button data-d="-1" data-id="${p.id}">−</button><span>${cart[p.id]||0} kg</span><button data-d="1" data-id="${p.id}">+</button></div></div>`).join('')}</div>`;
}
function checkout(){
  return `<button class="back" id="bk">← Back to shop</button><div class="card">${items().map(x=>`<div class="row"><span>${esc(x.p.name)} × ${x.q} kg</span><b>${money(x.q*x.p.price)}</b></div>`).join('')}
  <div class="row"><b>Total</b><b class="price">${money(total())}</b></div></div>
  <h3>Your details</h3><div class="card"><input id="nm" placeholder="Your name" value="${esc(f.n)}">
  <select id="md"><option ${mode==='Delivery'?'selected':''}>Delivery</option><option ${mode==='Pickup'?'selected':''}>Pickup</option></select>
  <input id="ad" placeholder="Delivery address / landmark" value="${esc(f.a)}"><textarea id="nt" rows="2" placeholder="Notes (preferred time, etc.)">${esc(f.t)}</textarea>
  <button class="btn w" id="send">Send order on WhatsApp</button><p class="mu" style="font-size:12px;margin:8px 0 0">WhatsApp opens with your order ready to send. Pay on delivery or pickup, or by MoMo: <b>Merchant ID 001333</b> or number <b>0596226266</b>.</p></div>`;
}
function open(msg){const a=document.createElement('a');a.href='https://wa.me/'+WA+'?text='+encodeURIComponent(msg);a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}
function bind(){
  const m=$('#m');
  m.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{cat=b.dataset.c;render()});
  m.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const id=b.dataset.id;cart[id]=Math.max(0,(cart[id]||0)+Number(b.dataset.d));render()});
  const rv=$('#rv');if(rv)rv.onclick=()=>{view='checkout';render();scrollTo(0,0)};
  const bk=$('#bk');if(bk)bk.onclick=()=>{keep();view='shop';render()};
  const ask=$('#ask');if(ask)ask.onclick=()=>open('Hello Berbin Enterprise, I would like to ask about your products.');
  const s=$('#send');if(s)s.onclick=()=>{keep();if(!f.n)return alert('Please enter your name.');if(mode==='Delivery'&&!f.a)return alert('Please enter a delivery address.');
    const lines=items().map(x=>`• ${x.p.name} × ${x.q} kg = ${money(x.q*x.p.price)}`);
    open(`Hello Berbin Enterprise, I would like to order:\n\n${lines.join('\n')}\n\nTotal: ${money(total())}\n\nName: ${f.n}\n${mode}${mode==='Delivery'?': '+f.a:''}${f.t?'\nNotes: '+f.t:''}`)};
}
function keep(){const n=$('#nm');if(n){f.n=n.value.trim();f.a=$('#ad').value.trim();f.t=$('#nt').value.trim();mode=$('#md').value}}
render();
</script></body></html>
